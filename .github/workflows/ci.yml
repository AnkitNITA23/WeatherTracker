name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore WeatherTracker.slnx

      - name: Build
        run: dotnet build WeatherTracker.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WeatherTracker.slnx --configuration Release --no-build
